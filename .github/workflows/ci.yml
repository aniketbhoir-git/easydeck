name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check deck schema and example decks
        run: |
          npm install --no-save ajv@8 ajv-formats@3
          node -e "
            const Ajv = require('ajv/dist/2020'); const fs = require('fs'); const path = require('path');
            const addFormats = require('ajv-formats');
            const ajv = new Ajv({ allErrors: true, strict: false }); addFormats(ajv);
            const validate = ajv.compile(JSON.parse(fs.readFileSync('schema/deck.schema.json', 'utf8')));
            const dir = 'examples';
            let bad = 0;
            if (fs.existsSync(dir)) for (const f of fs.readdirSync(dir).filter(f => f.endsWith('.deck.json'))) {
              if (!validate(JSON.parse(fs.readFileSync(path.join(dir, f), 'utf8')))) { bad++; console.error(f, validate.errors); }
            }
            process.exit(bad ? 1 : 0);
          "

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: UI tests
        working-directory: ui
        run: npx vitest run
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked

  core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Test core
        run: cargo test --locked -p easydeck-core
