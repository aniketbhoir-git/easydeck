name: CI

# NOTE: this workflow targets the layout that issue R1-1 creates (`src-tauri/` Cargo
# workspace and `ui/` with a package-lock.json). Until R1-1 merges, the `windows` job
# skips itself (see the `hashFiles` guard) and only the `schema` job runs.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check deck schema and example decks
        run: |
          npm install --no-save ajv@8 ajv-formats@3
          node -e "
            const Ajv = require('ajv/dist/2020'); const fs = require('fs'); const path = require('path');
            const addFormats = require('ajv-formats');
            const ajv = new Ajv({ allErrors: true, strict: false }); addFormats(ajv);
            const validate = ajv.compile(JSON.parse(fs.readFileSync('schema/deck.schema.json', 'utf8')));
            const dir = 'examples';
            let bad = 0;
            if (fs.existsSync(dir)) for (const f of fs.readdirSync(dir).filter(f => f.endsWith('.deck.json'))) {
              if (!validate(JSON.parse(fs.readFileSync(path.join(dir, f), 'utf8')))) { bad++; console.error(f, validate.errors); }
            }
            process.exit(bad ? 1 : 0);
          "

  # hashFiles() is not allowed in a job-level `if`, so a small job checks for the app first.
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_app: ${{ steps.check.outputs.has_app }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: |
          if [ -f src-tauri/Cargo.toml ]; then echo "has_app=true" >> "$GITHUB_OUTPUT"; else echo "has_app=false" >> "$GITHUB_OUTPUT"; fi

  windows:
    runs-on: windows-latest
    needs: detect
    if: needs.detect.outputs.has_app == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: Format
        working-directory: src-tauri
        run: cargo fmt --all -- --check
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build
        working-directory: src-tauri
        run: cargo build --locked
      - name: Test
        working-directory: src-tauri
        run: cargo test --locked
