name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: UI tests
        working-directory: ui
        run: npx vitest run
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked

  core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Test core
        run: cargo test --locked -p easydeck-core -p easydeck-cli
      - name: Generated files are up to date
        run: cargo run -p easydeck-cli --locked -- gen --check
      - name: Validate example decks
        run: cargo run -p easydeck-cli --locked -- validate examples/*.deck.json
