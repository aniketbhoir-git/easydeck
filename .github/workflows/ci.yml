name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Check
        run: cargo xtask check

  ui-linux:
    runs-on: ubuntu-latest
    # Same version as @playwright/test in ui/package.json. Screenshot baselines are made in this
    # image only (fonts differ per OS); see ui/e2e/README.md.
    container: mcr.microsoft.com/playwright:v1.65.1-noble
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        working-directory: ui
        run: npm ci
      - name: Check and unit tests
        working-directory: ui
        run: |
          npm run check
          npm test
      - name: Playwright
        working-directory: ui
        run: npx playwright test
      - name: Upload screenshots and diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-playwright
          path: |
            ui/test-results/
            ui/playwright-report/
          if-no-files-found: ignore

  core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Check (Linux subset)
        run: cargo xtask check --core
