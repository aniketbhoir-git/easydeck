name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: UI tests
        working-directory: ui
        run: npx vitest run
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked

  ui-linux:
    runs-on: ubuntu-latest
    # Same version as @playwright/test in ui/package.json. Screenshot baselines are made in this
    # image only (fonts differ per OS); see ui/e2e/README.md.
    container: mcr.microsoft.com/playwright:v1.65.1-noble
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        working-directory: ui
        run: npm ci
      - name: Check and unit tests
        working-directory: ui
        run: |
          npm run check
          npm test
      - name: Playwright
        working-directory: ui
        run: npx playwright test
      - name: Upload screenshots and diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-playwright
          path: |
            ui/test-results/
            ui/playwright-report/
          if-no-files-found: ignore

  core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Test core
        run: cargo test --locked -p easydeck-core -p easydeck-cli
      - name: Generated files are up to date
        run: cargo run -p easydeck-cli --locked -- gen --check
      - name: Validate example decks
        run: cargo run -p easydeck-cli --locked -- validate examples/*.deck.json
