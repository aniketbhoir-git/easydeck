[workspace]
members = ["crates/easydeck-core", "crates/easydeck-cli", "src-tauri", "xtask"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
jsonschema = { version = "0.61.1", default-features = false }
schemars = "=1.2.3"
ts-rs = "=12.0.1"
insta = { version = "=1.49.0", features = ["json"] }
