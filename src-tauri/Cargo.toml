[package]
name = "easydeck"
version = "0.1.0"
description = "Turn a small touch monitor into a deck"
edition = "2021"
license = "MIT"
default-run = "easydeck"

[lib]
name = "easydeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
