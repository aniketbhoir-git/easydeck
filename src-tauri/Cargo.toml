[package]
name = "easydeck-app"
version = "0.1.0"
description = "Turn a small touch monitor into a deck"
edition = "2021"
license = "MIT"
default-run = "easydeck"

[[bin]]
name = "easydeck"
path = "src/main.rs"

[lib]
name = "easydeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = "2"

[dependencies]
easydeck-core = { path = "../crates/easydeck-core" }
tauri = "2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
